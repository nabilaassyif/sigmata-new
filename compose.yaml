services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigmata}
      POSTGRES_USER: ${POSTGRES_USER:-sigmata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.12-alpine3.22
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    command: ['start-dev', '--import-realm']
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
      KC_DB: dev-file
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/sigmata-realm.json:/opt/keycloak/data/import/sigmata-realm.json:ro

  inference:
    build: ./services/inference
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    restart: unless-stopped
    init: true
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-sigmata}
      DATABASE_USER: ${POSTGRES_USER:-sigmata}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_ADDR: redis:6379
      INFERENCE_URL: http://inference:8000
      OIDC_ISSUER: http://localhost:8081/realms/sigmata
      OIDC_JWKS_URL: http://keycloak:8080/realms/sigmata/protocol/openid-connect/certs
      OIDC_AUDIENCE: sigmata-api
      OIDC_TOKEN_URL: http://keycloak:8080/realms/sigmata/protocol/openid-connect/token
      CITIZEN_ORIGIN: http://localhost:5173
      INTERNAL_ORIGIN: http://localhost:5174
      SESSION_COOKIE_SECURE: "false"
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
