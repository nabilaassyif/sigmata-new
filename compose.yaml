x-workflow-environment: &workflowEnvironment
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_HOST: postgres
  DATABASE_PORT: '5432'
  DATABASE_NAME: ${POSTGRES_DB:-sigmata}
  DATABASE_USER: ${POSTGRES_USER:-sigmata}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DATABASE_SSLMODE: disable
  REDIS_URL: ${REDIS_URL:-}
  REDIS_ADDR: redis:6379
  MUNICIPALITY_ID: ${MUNICIPALITY_ID:-00000000-0000-0000-0000-000000000001}
  INFERENCE_URL: http://inference:8000
  GARAGE_ENDPOINT: ${GARAGE_ENDPOINT:-}
  GARAGE_REGION: ${GARAGE_REGION:-}
  GARAGE_BUCKET: ${GARAGE_BUCKET:-}
  GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-}
  GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:-}
  FEATHERLESS_BASE_URL: ${FEATHERLESS_BASE_URL:-https://api.featherless.ai/v1}
  FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:-}
  FEATHERLESS_MODEL: ${FEATHERLESS_MODEL:-}

services:
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?Set GARAGE_ACCESS_KEY in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:?Set GARAGE_SECRET_KEY in .env}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:?Set GARAGE_BUCKET in .env}
    configs:
      - source: garageConfig
        target: /etc/garage.toml
    volumes:
      - garage_data:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigmata}
      POSTGRES_USER: ${POSTGRES_USER:-sigmata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.12-alpine3.22
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    command: ['start-dev', '--import-realm']
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
      KC_DB: dev-file
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/sigmata-realm.json:/opt/keycloak/data/import/sigmata-realm.json:ro
      - ./infra/keycloak/themes/sigmata:/opt/keycloak/themes/sigmata:ro

  inference:
    image: sigmata-inference:local
    build: ./services/inference
    restart: unless-stopped
    init: true
    environment:
      GRACE_MODEL_DOWNLOAD: 'true'
      GRACE_MODEL_ROOT: /app/model
      GRACE_MODEL_REPO: LeBabyOx/grace-laksa
      GRACE_MODEL_REVISION: ${GRACE_MODEL_REVISION:-c0b7110362767a5adcfc66af09011c60a13fa65a}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - grace_model:/app/model
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5m

  worker:
    image: sigmata-api:local
    build: ./apps/api
    restart: unless-stopped
    init: true
    environment:
      <<: *workflowEnvironment
      APP_MODE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy

  api:
    image: sigmata-api:local
    build: ./apps/api
    restart: unless-stopped
    init: true
    environment:
      <<: *workflowEnvironment
      OIDC_ISSUER: http://localhost:8081/realms/sigmata
      OIDC_JWKS_URL: http://keycloak:8080/realms/sigmata/protocol/openid-connect/certs
      OIDC_AUDIENCE: sigmata-api
      OIDC_TOKEN_URL: http://keycloak:8080/realms/sigmata/protocol/openid-connect/token
      CITIZEN_ORIGIN: http://localhost:5173
      INTERNAL_ORIGIN: http://localhost:5174
      SESSION_COOKIE_SECURE: "false"
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  grace_model:
  garage_data:

configs:
  garageConfig:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}"

      [s3_api]
      s3_region = "${GARAGE_REGION:-garage}"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"
