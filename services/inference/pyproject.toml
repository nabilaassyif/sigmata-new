[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'sigmata-inference'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = ['fastapi>=0.115,<1', 'uvicorn>=0.34,<1', 'pydantic>=2,<3', 'filelock>=3,<4']

[project.optional-dependencies]
test = ['pytest>=8,<10', 'httpx>=0.27,<1']
grace = [
  'torch>=2.4,<3', 'transformers==4.46.3', 'sentencepiece',
  'jax[cpu]>=0.8,<0.11', 'flax>=0.9', 'optax>=0.2',
  'orbax-checkpoint>=0.5', 'jraph>=0.0.6.dev0',
  'numpy>=1.24', 'pandas>=2', 'pyarrow>=14', 'scikit-learn>=1.3',
  'pyyaml',
]

[tool.setuptools.packages.find]
include = ['app*']
